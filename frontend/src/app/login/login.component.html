<div class="login-page">
  <div class="login-card">
    <h1>Welcome back</h1>
    <p class="subtitle">Please log in to continue</p>

    <form (submit)="onLogin()">
      <div class="field">
        <label for="email-input">Email</label>
        <input
          [(ngModel)]="email"
          name="email-input"
          id="email-input"
          type="text"
          required
          placeholder="you@example.com"
        />
      </div>

      <div class="field">
        <label for="password-input">Password</label>
        <input
          [(ngModel)]="password"
          name="password-input"
          id="password-input"
          type="password"
          required
          placeholder="••••••••"
        />
      </div>

      <button type="submit">Login</button>
    </form>

    <div class="register">
      <span>Not registered?</span>
      <button (click)="toRegistration()">Create account</button>
    </div>
  </div>
</div>
