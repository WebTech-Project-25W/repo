<p>Hello! please log in</p>
 <div class="login-div">
  
  <form (submit)="onLogin()">
    
    <label for="username-input">username</label>
    <input [(ngModel)]="username" name="username-input" id="username-input" type="text" required placeholder="username">
    
    <label for="password-input">password</label>
    <input [(ngModel)]="password" name="password-input" id="password-input" type="password" required placeholder="password">
    <button type="submit">Login</button>
  
  </form>

  <p>Not registered? -> </p>

  <button (click)="toRegistration()">Registration</button>

</div>
