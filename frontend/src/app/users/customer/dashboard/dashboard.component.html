<div class="owner-layout">

  <!-- CONTENT -->
  <main class="content">
    <h1 class="page-title">Restaurants</h1>

    <!-- RESTAURANTS -->
    <section *ngIf="activeSection === 'restaurants'">

      <div class="search-wrapper">
  <input
    class="search-input"
    type="text"
    placeholder="Search by restaurant name or opening hours"
    [(ngModel)]="searchText"
  />

  <div class="filters">
    <select class="filter-pill" [(ngModel)]="selectedCuisine">
      <option value="ALL">All cuisines</option>
      <option value="asian">Asian</option>
      <option value="italian">Italian</option>
      <option value="austrian">Austrian</option>
    </select>

    <select class="filter-pill" [(ngModel)]="selectedEta">
      <option value="ALL">All delivery times</option>
      <option value="UNDER_30">Under 30 min</option>
      <option value="30_60">30–60 min</option>
      <option value="OVER_60">60+ min</option>
    </select>
  </div>
</div>


        <div class="grid">
  <a
    class="card"
    *ngFor="let r of filteredRestaurants"
    [routerLink]="['/customer/restaurants', r.id]"
  >
    <div
      class="image"
      style="background-image: url('assets/images/my-rest.jpg')"
    ></div>

    <div class="content">
      <div class="top">
        <h3>{{ r.name }}</h3>
        <span class="badge open">Open</span>
      </div>

      <p>{{ r.address }}</p>

      <span class="mine">
        ⏱ {{ r.etaMin }}–{{ r.etaMax }} min
      </span>
    </div>
  </a>
</div>

      
    </section>
  </main>
