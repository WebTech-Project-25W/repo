<h2>My Orders</h2>

<p *ngIf="loading">Loading orders...</p>
<p *ngIf="!loading && error">{{ error }}</p>

<p *ngIf="!loading && orders.length === 0">
  You have no orders yet.
</p>

<div class="orders-list" *ngIf="!loading && orders.length > 0">
  <div
    class="order-card"
    *ngFor="let o of orders"
    (click)="goToOrder(o.orderid)"
  >
    <div class="order-header">
      <span class="order-id">Order #{{ o.orderid }}</span>
      <span class="order-status" [ngClass]="o.status.toLowerCase()">
        {{ o.status }}
      </span>
    </div>

    <div class="order-body">
      <div class="restaurant">{{ o.restaurantname }}</div>
      <div class="total">€{{ o.total | number:'1.2-2' }}</div>
    </div>
  </div>
</div>
