<div class="page">

  <!-- Back -->
  <a class="back-link" [routerLink]="['/customer/orders']">
    ← Back to My Orders
  </a>

  <!-- Order Card -->
  <div class="card">
    <h2 class="card-title">Order #{{ orderId }}</h2>

    <p *ngIf="loading" class="muted">Loading order details…</p>
    <p *ngIf="!loading && error" class="error">{{ error }}</p>

    <div *ngIf="!loading && items.length === 0" class="muted">
      This order has no items.
    </div>

    <!-- Items -->
    <div *ngIf="!loading && items.length > 0" class="items">
      <div class="item header">
        <span>Dish</span>
        <span>Number</span>
        <span>Price</span>
        <span>Subtotal</span>
      </div>

      <div class="item" *ngFor="let i of items">
        <span>{{ i.name }}</span>
        <span>{{ i.quantity }}</span>
        <span>€{{ i.unitprice | number:'1.2-2' }}</span>
        <span>€{{ i.subtotal | number:'1.2-2' }}</span>
      </div>

      <div class="total">
        Total: €{{ total | number:'1.2-2' }}
      </div>
    </div>
  </div>

</div>
