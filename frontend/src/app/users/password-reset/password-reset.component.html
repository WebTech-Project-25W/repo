<div class="password-reset-div">
  <p>Password-reset</p>
  
  <form (submit)="onResetPassword()">

    <label for="new-password-input">new password</label>
    <input [(ngModel)]="newPassword" name="new-password-input" id="new-password-input" type="password" required placeholder="new password">

    <button type="submit">Reset password</button>

  </form>
</div>
