<div class="password-reset-div">
  <h2>Password Reset</h2>
  
  <form class="reset-form full-width" (submit)="onResetPassword()">

    <div>
      <label class="new-pass-label" for="new-password-input">new password</label>
      <input class="new-pass-input" [(ngModel)]="newPassword" name="new-password-input" id="new-password-input" type="password" required placeholder="new password">
    </div>

    <button type="submit">Reset password</button>

  </form>
</div>
