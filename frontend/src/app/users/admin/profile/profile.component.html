<h1 class="page-title">My Profile</h1>

<div class="profile-card">

  <h2>Edit Profile</h2>

  <div *ngIf="loading">Loading profile...</div>
  <div *ngIf="error" class="error-text">{{ error }}</div>
  <div *ngIf="success" class="success-text">{{ success }}</div>

  <div class="form-grid">

    <div class="form-group">
      <label>First name</label>
      <input name="firstname" [(ngModel)]="profile.firstname" [ngModelOptions]="{ standalone: true }" />
    </div>

    <div class="form-group">
      <label>Last name</label>
      <input name="lastname" [(ngModel)]="profile.lastname" [ngModelOptions]="{ standalone: true }" />
    </div>


  </div>

  <button class="primary-btn" (click)="save()">Save Settings</button>

  <h2 style="margin-top: 32px;">Current Saved Settings</h2>

  <div class="saved-info">
    <p><strong>First name:</strong> {{ savedProfile.firstname }}</p>
    <p><strong>Last name:</strong> {{ savedProfile.lastname }}</p>
  </div>
</div>
<app-password-reset></app-password-reset>
