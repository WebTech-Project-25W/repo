<div class="owners-container">
  <h2>Owners</h2>

  <div class="filter-bar">
    <input type="text" name="searchEmail" [(ngModel)]="searchEmail" placeholder="Search by email..."
      (keyup.enter)="applyFilters()">
    <input type="text" name="searchFirstName" [(ngModel)]="searchFirstName" placeholder="Search by first name..."
      (keyup.enter)="applyFilters()">
    <input type="text" name="searchLastName" [(ngModel)]="searchLastName" placeholder="Search by last name..."
      (keyup.enter)="applyFilters()">

    <button (click)="applyFilters()" class="btn-search">Search</button>
    <button (click)="clearFilters()" class="btn-clear">Clear</button>
  </div>

  <table class="owners-table">
    <thead>
      <tr>
        <th>Email</th>
        <th>First Name</th>
        <th>Last Name</th>
      </tr>
    </thead>
    <tbody>
      @for (owner of owners; track owner.email) {
      <tr>
        <td class="email-text">{{ owner.email }}</td>
        <td>{{ owner.firstname }}</td>
        <td>{{ owner.lastname }}</td>
      </tr>
      } @empty {
      <tr>
        <td colspan="3" class="no-data">No owners found.</td>
      </tr>
      }
    </tbody>
  </table>

  <div class="pagination-controls">
    <div class="limit-selector">
      <label for="limit">Rows per page:</label>
      <select id="limit" [(ngModel)]="limit" (change)="onLimitChange()">
        <option [ngValue]="5">5</option>
        <option [ngValue]="10">10</option>
        <option [ngValue]="20">20</option>
        <option [ngValue]="50">50</option>
      </select>
    </div>
    <div class="page-navigation">
      <button (click)="previousPage()" [disabled]="currentPage === 0">
        Previous
      </button>
      <span>Page {{ currentPage + 1 }} | {{ startIndex + 1 }}-{{ endIndex }} of {{ totalEntries }}</span>
      <button (click)="nextPage()" [disabled]="endIndex >= totalEntries">
        Next
      </button>
    </div>
  </div>
</div>
