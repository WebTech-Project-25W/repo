<div class="admins-container">
  <h2>Admins</h2>

  <div class="filter-bar">
    <input type="text" name="searchEmail" [(ngModel)]="searchEmail" placeholder="Search by email..."
      (keyup.enter)="applyFilters()">
    <input type="text" name="searchFirstName" [(ngModel)]="searchFirstName" placeholder="Search by first name..."
      (keyup.enter)="applyFilters()">
    <input type="text" name="searchLastName" [(ngModel)]="searchLastName" placeholder="Search by last name..."
      (keyup.enter)="applyFilters()">

    <button (click)="applyFilters()" class="btn-search">Search</button>
    <button (click)="clearFilters()" class="btn-clear">Clear</button>
  </div>

  <table class="admins-table">
    <thead>
      <tr>
        <th>Email</th>
        <th>First Name</th>
        <th>Last Name</th>
      </tr>
    </thead>
    <tbody>
      @for (admin of data; track admin.email) {
      <tr>
        <td class="email-text">{{ admin.email }}</td>
        <td>{{ admin.firstname }}</td>
        <td>{{ admin.lastname }}</td>
      </tr>
      } @empty {
      <tr>
        <td colspan="3" class="no-data">No admins found.</td>
      </tr>
      }
    </tbody>
  </table>

  <app-pagination
    [limit]="limit"
    [currentPage]="currentPage" 
    [totalEntries]="totalEntries"
    (limitChange)="onLimitChange($event)"
    (pageChange)="onPageChange($event)">
  ></app-pagination>
</div>
